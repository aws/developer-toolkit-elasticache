# Keeps pinned dependencies current. Takes effect only on the default branch.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions: bumps the SHA pins and their `# vX.Y.Z` comments in workflows.
  # Grouped into one PR to avoid five separate bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python: runtime deps in python/pyproject.toml and the pinned dev/build/publish
  # tooling in python/requirements/dev.txt. One entry covers both, because Dependabot
  # scans a directory recursively for pyproject.toml and requirements *.txt files; a
  # second entry for python/requirements produced a duplicate PR for every bump.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Node runtime/dev dependencies in node/package.json.
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    groups:
      node:
        patterns: ["*"]

  # Java runtime and test dependencies in java/pom.xml.
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    groups:
      java:
        patterns: ["*"]

  # Standalone Java example build plugins.
  - package-ecosystem: maven
    directory: /java/examples
    schedule:
      interval: weekly
    groups:
      java-examples:
        patterns: ["*"]
