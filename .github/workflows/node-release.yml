name: Publish Node package to npm

# Follows https://docs.npmjs.com/trusted-publishers. The npm trusted publisher must
# reference this exact filename and the `npm` environment, or OIDC publishing is
# rejected. Provenance is generated automatically by trusted publishing.

on:
  release:
    types: [published]

permissions:
  contents: read

# cancel-in-progress: false — cancelling mid-publish can leave a release half done.
concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Source of truth for the test matrix: package.json's supportedNodeVersions.
  # node-v* tags only — test/build/publish inherit this via `needs`.
  versions:
    name: node versions
    if: startsWith(github.ref_name, 'node-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      data: ${{ steps.set.outputs.data }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate supported versions from package.json
        id: set
        working-directory: node
        run: echo "data=$(npm run --silent list-supported-versions)" >> "$GITHUB_OUTPUT"

  # Full support matrix gates the release. Ubuntu only: the package is pure JavaScript
  # and the CI workflow already covers Windows and macOS. No dependency caching in
  # release builds, per npm's trusted-publishing guidance.
  test:
    name: test (Node ${{ matrix.node-version }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # report every version, not just the first failure
      matrix:
        node-version: ${{ fromJson(needs.versions.outputs.data).all }}
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        timeout-minutes: 10
        run: npm test

  build:
    name: build and verify
    needs: [versions, test]
    if: startsWith(github.ref_name, 'node-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ fromJson(needs.versions.outputs.data).max }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Tag must match package.json's version, `private` must be gone, CHANGELOG must
      # have an entry, and repository.url must be set (provenance verifies it).
      - name: Verify the tag matches the packaged version and the package is publishable
        run: npm run --silent verify -- "$GITHUB_REF_NAME"

      - name: Build and validate the package contents
        timeout-minutes: 5
        run: |
          npm run build
          npm pack --dry-run

  publish:
    name: publish
    needs: [versions, build]
    if: startsWith(github.ref_name, 'node-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the environment name on the npm trusted publisher; carries the
    # required-reviewer gate so a run alone cannot publish.
    environment: npm
    permissions:
      # Job permissions REPLACE the top-level block, so restate contents: read.
      contents: read
      id-token: write  # OIDC token for npm trusted publishing
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ fromJson(needs.versions.outputs.data).max }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; the newest supported Node bundles a
      # newer one, so assert rather than install npm from the registry at publish time.
      - name: Verify again on the publishing runner, including the npm version
        run: npm run --silent verify -- "$GITHUB_REF_NAME" --require-npm 11.5.1

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # OIDC: no token, no --provenance flag; publishConfig.access is public.
      - name: Publish to npm
        run: npm publish

      - name: Smoke-test the published package
        run: npm run --silent smoke -- "${GITHUB_REF_NAME#node-v}"
