name: Node CI

# Path-filtered so the Node package is validated independently.
on:
  push:
    branches:
      - main
      - "release-*"
    paths:
      - "node/**"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "node/**"
      - ".github/workflows/node.yml"

permissions:
  contents: read

jobs:
  # Load the test matrix from package.json's supportedNodeVersions.
  versions:
    name: node versions
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.set.outputs.data }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate supported versions from package.json
        id: set
        working-directory: node
        run: echo "data=$(npm run --silent list-supported-versions)" >> "$GITHUB_OUTPUT"

  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ${{ fromJson(needs.versions.outputs.data).all }}
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate package contents
        run: npm pack --dry-run
