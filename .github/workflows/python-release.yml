name: Publish Python package to PyPI

# Trusted publisher on PyPI must reference this exact filename and the `pypi`
# environment, or publishing is rejected.

on:
  release:
    types: [published]

permissions:
  contents: read

# cancel-in-progress: false — cancelling mid-publish can corrupt a release.
concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full support matrix gates the release; build/publish depend on it.
  # Re-runs the ubuntu CI tests here as one of the release gates.
  # python-v* tags only
  test:
    name: test (py${{ matrix.python-version }})
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # report every version, not just the first failure
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install and run the test suite
        timeout-minutes: 10
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  build:
    name: build and verify
    needs: test
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Tag must match pyproject.toml version, and the `Private :: Do Not Upload`
      # guard must be gone — fail the release loudly otherwise.
      - name: Verify the tag matches the packaged version and the package is publishable
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#python-v}"
          pkg_version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Release tag is python-v${tag_version} but pyproject.toml declares ${pkg_version}. Bump the version and re-tag."
            exit 1
          fi
          if grep -q "Private :: Do Not Upload" pyproject.toml; then
            echo "::error::The 'Private :: Do Not Upload' classifier is still set. Remove it in the release commit once the open-source review has cleared."
            exit 1
          fi
          echo "Publishing version ${pkg_version}."

      - name: Build wheel and sdist
        timeout-minutes: 5
        run: |
          python -m pip install --isolated build==1.5.0
          python -m build

      - name: Check artifact metadata
        timeout-minutes: 5
        run: |
          python -m pip install --isolated twine==7.0.0
          python -m twine check --strict dist/*

      - name: Save built distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error  # an empty artifact silently breaks the publish job

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment name on the trusted publisher; carries the
    # required-reviewer gate so a run alone cannot publish.
    environment: pypi
    permissions:
      # Job permsissions REPLACE the top-level block, so restate contents: read.
      contents: read
      id-token: write  # OIDC token for PyPI auth + PEP 740 attestation signing
    steps:
      - name: Retrieve built distributions from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

      # Prove the uploaded artifact installs and runs from PyPI. Retry: the index
      # can lag the upload.
      - name: Smoke-test the published package
        run: |
          set -euo pipefail
          version="$(python3 -c "import pathlib; print(next(pathlib.Path('dist').glob('*.whl')).name.split('-')[1])")"
          python3 -m venv /tmp/smoke
          for attempt in $(seq 1 5); do
            if /tmp/smoke/bin/pip install "developer-toolkit-elasticache==${version}"; then
              break
            fi
            echo "install attempt ${attempt} failed (index may lag the upload); retrying in 15s"
            sleep 15
          done
          /tmp/smoke/bin/developer-toolkit-elasticache --help
          /tmp/smoke/bin/python -c "import developer_toolkit_elasticache"
