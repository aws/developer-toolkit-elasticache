name: Python CI

# Path-filtered so the Python package builds standalone: this workflow only
# runs when files under python/ (or this workflow itself) change.
on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/python-versions.json"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/python-versions.json"

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lint and format check
        run: bash scripts/lint.sh

  # Load supported Python versions from the shared JSON file.
  versions:
    name: load python versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: set
        working-directory: ${{ github.workspace }}
        run: bash python/scripts/load_python_versions.sh

  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported version runs on Linux;
        # the other platforms test the ends of the range, which is where
        # interpreter differences show up.
        os: [ubuntu-latest]
        python-version: ${{ fromJson(needs.versions.outputs.matrix) }}
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-14
            python-version: "3.10"
          - os: macos-14
            python-version: "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and run tests
        run: bash scripts/test.sh
