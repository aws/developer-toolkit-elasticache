name: Python CI

# Path-filtered so the Python package builds standalone: this workflow only
# runs when files under python/ (or this workflow itself) change.
on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lint and format check
        run: python python/dev.py lint

  # Load Python versions generated from [tool.python-support].
  versions:
    name: python versions
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.set.outputs.data }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate supported versions from pyproject.toml
        id: set
        run: echo "data=$(python python/dev.py versions)" >> "$GITHUB_OUTPUT"

  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported version runs on Linux;
        # the other platforms test the ends of the range, which is where
        # interpreter differences show up.
        os: [ubuntu-latest]
        python-version: ${{ fromJson(needs.versions.outputs.data).all }}
        include:
          - os: windows-latest
            python-version: "${{ fromJson(needs.versions.outputs.data).min }}"
          - os: windows-latest
            python-version: "${{ fromJson(needs.versions.outputs.data).max }}"
          - os: macos-14
            python-version: "${{ fromJson(needs.versions.outputs.data).min }}"
          - os: macos-14
            python-version: "${{ fromJson(needs.versions.outputs.data).max }}"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and run tests
        run: python python/dev.py test
